<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E7C66">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sema Kiswahili — Practise with learners</title>
<style>
  :root{
    --brand:#0E7C66;
    --brand-2:#0A5C4B;
    --brand-soft:#E6F4F0;
    --bg:#F2F6F4;
    --surface:#FFFFFF;
    --line:#E3EAE7;
    --text:#0F1F1B;
    --muted:#6B7C77;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    background:#0c1a17;
    overscroll-behavior:none;
  }

  /* ---------- Shell ---------- */
  .app{
    position:relative;
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    margin:0 auto;
    overflow:hidden;
    background:var(--bg);
  }
  @media (min-width:540px){
    body{
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(900px 600px at 20% 0%, #12503f 0%, transparent 60%),
        radial-gradient(700px 500px at 90% 100%, #0b3b34 0%, transparent 60%),
        #07110f;
    }
    .app{
      height:min(880px, calc(100dvh - 48px));
      border-radius:28px;
      box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    }
  }

  /* ---------- Views ---------- */
  .view{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    will-change:transform;
  }
  .chat-view{transform:translateX(100%);background:#EFF4F2;}
  .app.chat-open .view:not(.chat-view){transform:translateX(-24%);}
  .app.chat-open .chat-view{transform:translateX(0);}

  /* ---------- App bar (list) ---------- */
  .appbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 16px 16px;
    background:linear-gradient(135deg,#0E7C66 0%,#0A5C4B 100%);
    color:#fff;
  }
  .brand-mark{
    width:42px;height:42px;flex:0 0 auto;
    border-radius:13px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.22);
    display:grid;place-items:center;
    font-weight:800;font-size:18px;letter-spacing:.5px;
  }
  .appbar h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    letter-spacing:.2px;
  }
  .appbar p{
    margin:2px 0 0;
    font-size:12px;
    opacity:.82;
    font-weight:500;
  }
  .demo-pill{
    margin-left:auto;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.2px;
    padding:5px 9px;
    border-radius:999px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.25);
  }

  /* ---------- Search ---------- */
  .searchwrap{
    position:relative;
    margin:12px 16px 6px;
    flex:0 0 auto;
  }
  .searchwrap svg{
    position:absolute;
    left:14px;top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
  }
  .searchwrap input{
    width:100%;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:14px;
    padding:12px 14px 12px 42px;
    font-size:16px;
    font-family:inherit;
    color:var(--text);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .searchwrap input::placeholder{color:#9AA9A4;}
  .searchwrap input:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(14,124,102,.12);
  }

  .section-label{
    flex:0 0 auto;
    padding:10px 18px 6px;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.1px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .section-label span{color:var(--brand);}

  /* ---------- Chat list ---------- */
  .chat-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
  }
  .chat-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:10px 16px;
    background:transparent;
    border:0;
    font:inherit;
    color:inherit;
    text-align:left;
    cursor:pointer;
    transition:background .12s;
  }
  .chat-item:active{background:#E7EFEC;}
  .chat-item:not(:last-child)::after{
    content:"";
    position:absolute;
    left:80px;right:16px;bottom:0;
    height:1px;background:var(--line);
  }

  .avatar{
    position:relative;
    flex:0 0 auto;
    width:52px;height:52px;
    border-radius:50%;
    background:var(--av,#0E7C66);
    color:#fff;
    display:grid;place-items:center;
    font-weight:700;
    font-size:16px;
    letter-spacing:.4px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .avatar.sm{width:40px;height:40px;font-size:13.5px;}
  .dot{
    position:absolute;
    right:-1px;bottom:-1px;
    width:13px;height:13px;
    border-radius:50%;
    background:#22C55E;
    border:2.5px solid #fff;
  }

  .chat-item-body{flex:1;min-width:0;}
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .row + .row{margin-top:3px;}
  .name{
    font-size:15px;
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .time{
    flex:0 0 auto;
    font-size:11.5px;
    font-weight:500;
    color:var(--muted);
  }
  .preview{
    flex:1;
    min-width:0;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .badge{
    flex:0 0 auto;
    min-width:19px;height:19px;
    padding:0 5px;
    border-radius:10px;
    background:var(--brand);
    color:#fff;
    font-size:11px;
    font-weight:800;
    display:grid;place-items:center;
  }
  .empty{
    padding:40px 24px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  /* ---------- Chat header ---------- */
  .chatbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px 6px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 10px rgba(15,31,27,.04);
    z-index:2;
  }
  .icon-btn{
    flex:0 0 auto;
    width:40px;height:40px;
    display:grid;place-items:center;
    border:0;background:transparent;
    color:var(--text);
    border-radius:50%;
    cursor:pointer;
  }
  .icon-btn:active{background:#EDF3F1;}
  .chatbar-info{flex:1;min-width:0;}
  .chatbar-info h2{
    margin:0;
    font-size:15.5px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chatbar-info p{
    margin:2px 0 0;
    font-size:11.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .level-pill{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:800;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--brand);
    background:var(--brand-soft);
    padding:6px 10px;
    border-radius:999px;
  }

  /* ---------- Messages ---------- */
  .messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:14px 14px 8px;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(14,124,102,.06), transparent 42%),
      radial-gradient(circle at 88% 85%, rgba(14,124,102,.06), transparent 42%);
  }
  .day-divider{
    align-self:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:var(--muted);
    background:rgba(255,255,255,.85);
    border:1px solid var(--line);
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:4px;
  }
  .msg{display:flex;animation:pop .22s ease-out;}
  .msg.out{justify-content:flex-end;}
  @keyframes pop{
    from{opacity:0;transform:translateY(6px) scale(.98);}
    to{opacity:1;transform:none;}
  }
  .bubble{
    max-width:78%;
    padding:9px 12px 6px;
    border-radius:16px;
    font-size:15px;
    line-height:1.42;
    word-wrap:break-word;
    overflow-wrap:anywhere;
  }
  .msg.in .bubble{
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom-left-radius:5px;
    box-shadow:0 1px 2px rgba(15,31,27,.04);
  }
  .msg.out .bubble{
    background:var(--brand);
    color:#fff;
    border-bottom-right-radius:5px;
    box-shadow:0 2px 8px rgba(14,124,102,.25);
  }
  .sub{
    display:block;
    margin-top:4px;
    font-size:12px;
    font-style:italic;
    color:var(--muted);
  }
  .meta{
    display:block;
    margin-top:3px;
    font-size:10px;
    text-align:right;
    opacity:.55;
  }
  .msg.out .meta{color:#fff;opacity:.72;}

  .tdots{display:inline-flex;gap:4px;align-items:center;padding:3px 0;}
  .tdots span{
    width:6px;height:6px;border-radius:50%;
    background:#9CB2AC;
    animation:blink 1.2s infinite ease-in-out;
  }
  .tdots span:nth-child(2){animation-delay:.18s;}
  .tdots span:nth-child(3){animation-delay:.36s;}
  @keyframes blink{
    0%,65%,100%{opacity:.35;transform:translateY(0);}
    30%{opacity:1;transform:translateY(-2px);}
  }

  /* ---------- Quick replies ---------- */
  .quick-replies{
    flex:0 0 auto;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:8px 12px;
    background:var(--surface);
    border-top:1px solid var(--line);
    scrollbar-width:none;
  }
  .quick-replies::-webkit-scrollbar{display:none;}
  .quick-replies[hidden]{display:none;}
  .chip{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(14,124,102,.35);
    background:var(--brand-soft);
    color:var(--brand-2);
    font-family:inherit;
    font-size:13px;
    font-weight:650;
    white-space:nowrap;
    cursor:pointer;
    transition:transform .1s, background .15s;
  }
  .chip:active{transform:scale(.96);background:#D5EBE5;}

  /* ---------- Composer ---------- */
  .composer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface);
    border-top:1px solid var(--line);
  }
  .composer input{
    flex:1;
    min-width:0;
    border:1px solid var(--line);
    background:#F3F7F5;
    border-radius:22px;
    padding:12px 16px;
    font-size:16px;
    font-family:inherit;
    color:var(--text);
    outline:none;
    transition:border-color .15s, background .15s;
  }
  .composer input:focus{
    border-color:var(--brand);
    background:#fff;
  }
  .send-btn{
    flex:0 0 auto;
    width:46px;height:46px;
    border:0;
    border-radius:50%;
    background:linear-gradient(135deg,#0E7C66,#0A5C4B);
    color:#fff;
    display:grid;place-items:center;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(14,124,102,.35);
    transition:transform .1s;
  }
  .send-btn:active{transform:scale(.93);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important;}
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ============ LIST VIEW ============ -->
  <section class="view" id="listView">
    <header class="appbar">
      <div class="brand-mark">SK</div>
      <div>
        <h1>Sema Kiswahili</h1>
        <p>Chat with learners · Practise together</p>
      </div>
      <span class="demo-pill">DEMO</span>
    </header>

    <div class="searchwrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
      </svg>
      <input id="search" type="search" placeholder="Search a learner or country"
             autocomplete="off" spellcheck="false">
    </div>

    <div class="section-label">Learners · <span id="count">20</span></div>
    <div class="chat-list" id="chatList"></div>
  </section>

  <!-- ============ CHAT VIEW ============ -->
  <section class="view chat-view" id="chatView">
    <header class="chatbar">
      <button class="icon-btn" id="backBtn" aria-label="Back to learners">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="avatar sm" id="chatAvatar">--</div>
      <div class="chatbar-info">
        <h2 id="chatName">—</h2>
        <p id="chatStatus">—</p>
      </div>
      <span class="level-pill" id="chatLevel">—</span>
    </header>

    <div class="messages" id="messages">
      <div class="day-divider">Today</div>
    </div>

    <div class="quick-replies" id="quickReplies" hidden></div>

    <form class="composer" id="composer">
      <input id="msgInput" type="text" placeholder="Andika ujumbe…" autocomplete="off"
             spellcheck="false" enterkeyhint="send">
      <button class="send-btn" type="submit" aria-label="Send message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.99.99 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
        </svg>
      </button>
    </form>
  </section>

</div>

<script>
(() => {
  "use strict";

  /* ---------------- Data ---------------- */
  const RAW = [
    { name:"Emma Wilson",     country:"United Kingdom", flag:"🇬🇧", level:"Beginner",     online:true,  last:"Thank you — I will practise this evening.",        time:"09:24", unread:2, goal:"prepare for a business trip to Zanzibar" },
    { name:"Liam Carter",     country:"United States",  flag:"🇺🇸", level:"Beginner",     online:true,  last:"Could you clarify how to say good morning?",       time:"08:51", unread:0, goal:"work more effectively with colleagues in Nairobi" },
    { name:"Sofia Rossi",     country:"Italy",          flag:"🇮🇹", level:"Elementary",   online:false, last:"Thank you for the warm welcome.",                  time:"Yesterday", unread:1, goal:"volunteer on a health programme in Mombasa" },
    { name:"Yuki Tanaka",     country:"Japan",          flag:"🇯🇵", level:"Beginner",     online:true,  last:"Is “Ninafanya kazi” the correct form?",             time:"Yesterday", unread:0, goal:"collaborate with a design team in Nairobi" },
    { name:"Hans Müller",     country:"Germany",        flag:"🇩🇪", level:"Beginner",     online:false, last:"Apologies — I meant to say asante.",               time:"Yesterday", unread:3, goal:"follow Swahili films without subtitles" },
    { name:"Amara Okafor",    country:"Nigeria",        flag:"🇳🇬", level:"Intermediate", online:true,  last:"Tutaonana baadaye — see you later.",               time:"Tue", unread:0, goal:"visit family friends in Kisumu" },
    { name:"Lucas Silva",     country:"Brazil",         flag:"🇧🇷", level:"Beginner",     online:false, last:"May we review numbers in today's session?",        time:"Tue", unread:0, goal:"join a football exchange in Kenya" },
    { name:"Chloé Dubois",    country:"France",         flag:"🇫🇷", level:"Elementary",   online:true,  last:"Thank you very much — asante sana.",               time:"Mon", unread:1, goal:"study abroad in Nairobi next semester" },
    { name:"Noah van Dijk",   country:"Netherlands",    flag:"🇳🇱", level:"Beginner",     online:false, last:"Could you explain the meaning of “pole pole”?",    time:"Mon", unread:0, goal:"prepare for a safari in the Maasai Mara" },
    { name:"Priya Sharma",    country:"India",          flag:"🇮🇳", level:"Beginner",     online:true,  last:"Habari za asubuhi — good morning.",                time:"Mon", unread:0, goal:"introduce my students to East African culture" },
    { name:"Ahmed Hassan",    country:"Egypt",          flag:"🇪🇬", level:"Intermediate", online:false, last:"I am progressing well, thank you.",                time:"Sun", unread:0, goal:"work with suppliers based in Mombasa" },
    { name:"Isabella García", country:"Spain",          flag:"🇪🇸", level:"Beginner",     online:true,  last:"Tutaonana — until next time.",                     time:"Sun", unread:0, goal:"travel independently across East Africa" },
    { name:"Min-jun Park",    country:"South Korea",    flag:"🇰🇷", level:"Beginner",     online:false, last:"I would like to start with greetings, please.",    time:"Sun", unread:0, goal:"build lasting friendships with Kenyan peers" },
    { name:"Olivia Brown",    country:"Australia",      flag:"🇦🇺", level:"Elementary",   online:true,  last:"Kwaheri — talk again tomorrow.",                   time:"Sat", unread:0, goal:"join a community project in Kilifi" },
    { name:"Diego Fernández", country:"Mexico",         flag:"🇲🇽", level:"Beginner",     online:false, last:"Nimefurahi kukutana nawe — pleased to meet you.",  time:"Sat", unread:2, goal:"write songs that include Swahili lyrics" },
    { name:"Anna Kowalska",   country:"Poland",         flag:"🇵🇱", level:"Beginner",     online:true,  last:"Thank you — asante.",                              time:"Fri", unread:0, goal:"work as a nurse in Tanzania" },
    { name:"Chen Wei",        country:"China",          flag:"🇨🇳", level:"Beginner",     online:false, last:"Nataka kujifunza Kiswahili — I want to learn.",    time:"Fri", unread:0, goal:"add a third language to my professional skills" },
    { name:"Fatima Al-Zahra", country:"Morocco",        flag:"🇲🇦", level:"Intermediate", online:true,  last:"Thank you for your assistance.",                   time:"Thu", unread:0, goal:"read Swahili poetry in the original" },
    { name:"Erik Johansson",  country:"Sweden",         flag:"🇸🇪", level:"Beginner",     online:false, last:"Tutaonana kesho — see you tomorrow.",              time:"Wed", unread:0, goal:"attend a wedding in Nairobi this December" },
    { name:"Zara Khan",       country:"Pakistan",       flag:"🇵🇰", level:"Beginner",     online:true,  last:"Jambo — I am glad to be here.",                    time:"Wed", unread:0, goal:"pursue a career in translation" }
  ];

  const PALETTE = [
    "#E4572E","#0E7C66","#7C3AED","#0891B2","#DB2777",
    "#F59E0B","#2563EB","#059669","#B45309","#9333EA",
    "#DC2626","#0D9488","#4F46E5","#CA8A04","#BE185D",
    "#0284C7","#65A30D","#C026D3","#EA580C","#0F766E"
  ];

  const CANNED = [
    { t:"Asante sana.",                                s:"Thank you very much." },
    { t:"Habari yako?",                                s:"How are you?" },
    { t:"Polepole tafadhali.",                         s:"Slowly, please." },
    { t:"Nimefurahi. Ninajifunza kila siku.",          s:"I am glad. I study every day." },
    { t:"Hii ni nzuri sana.",                          s:"This is very good." },
    { t:"Naweza kusema Kiswahili kidogo.",             s:"I can speak a little Swahili." }
  ];

  const QUICK = [
    "Jambo! Habari yako?",
    "Karibu — welcome.",
    "Unajifunza Kiswahili?",
    "Pole pole, tutasaidiana."
  ];

  const contacts = RAW.map((c, i) => ({
    ...c,
    id: i + 1,
    first: c.name.split(" ")[0],
    initials: c.name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase(),
    color: PALETTE[i % PALETTE.length]
  }));

  /* ---------------- Elements ---------------- */
  const app        = document.getElementById("app");
  const chatList   = document.getElementById("chatList");
  const countEl    = document.getElementById("count");
  const searchEl   = document.getElementById("search");
  const messages   = document.getElementById("messages");
  const composer   = document.getElementById("composer");
  const msgInput   = document.getElementById("msgInput");
  const backBtn    = document.getElementById("backBtn");
  const chatName   = document.getElementById("chatName");
  const chatStatus = document.getElementById("chatStatus");
  const chatAvatar = document.getElementById("chatAvatar");
  const chatLevel  = document.getElementById("chatLevel");
  const quickWrap  = document.getElementById("quickReplies");

  /* ---------------- State ---------------- */
  let current   = null;
  let session   = 0;      // invalidates pending timers on navigation
  let typingEl  = null;
  let replyIdx  = 0;

  const nowTime = () =>
    new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });

  /* Runs `fn` only if the user hasn't navigated away in the meantime. */
  function later(fn, ms) {
    const gen = session;
    return setTimeout(() => { if (gen === session) fn(); }, ms);
  }

  /* Human-like typing duration, based on message length. */
  function typingDelay(text) {
    const ms = 750 + text.length * 60;
    return Math.max(1100, Math.min(ms, 3000));
  }

  /* A natural pause before someone starts replying. */
  const readPause = (min, max) => min + Math.random() * (max - min);

  /* ---------------- List rendering ---------------- */
  function renderList(query = "") {
    const q = query.trim().toLowerCase();
    const items = contacts.filter(c =>
      !q || c.name.toLowerCase().includes(q) || c.country.toLowerCase().includes(q)
    );

    countEl.textContent = items.length;

    if (!items.length) {
      chatList.innerHTML = `<div class="empty">No learners found.<br>Try another name or country.</div>`;
      return;
    }

    chatList.innerHTML = items.map(c => `
      <button class="chat-item" data-id="${c.id}">
        <div class="avatar" style="--av:${c.color}">
          ${c.initials}
          ${c.online ? '<span class="dot"></span>' : ""}
        </div>
        <div class="chat-item-body">
          <div class="row">
            <span class="name">${c.name}</span>
            <span class="time">${c.time}</span>
          </div>
          <div class="row">
            <span class="preview">${c.flag} ${c.last}</span>
            ${c.unread ? `<span class="badge">${c.unread}</span>` : ""}
          </div>
        </div>
      </button>
    `).join("");
  }

  /* ---------------- Messages ---------------- */
  function scrollBottom() {
    requestAnimationFrame(() => { messages.scrollTop = messages.scrollHeight; });
  }

  function addBubble(text, dir, sub) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + dir;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = text;
    bubble.appendChild(txt);

    if (sub) {
      const s = document.createElement("span");
      s.className = "sub";
      s.textContent = sub;
      bubble.appendChild(s);
    }

    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = nowTime();
    bubble.appendChild(meta);

    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    scrollBottom();
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "msg in";
    typingEl.innerHTML =
      '<div class="bubble"><span class="tdots"><span></span><span></span><span></span></span></div>';
    messages.appendChild(typingEl);
    scrollBottom();
  }

  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  /* ---------------- Quick replies ---------------- */
  function showQuickReplies() {
    quickWrap.innerHTML = QUICK
      .map(q => `<button type="button" class="chip">${q}</button>`)
      .join("");
    quickWrap.hidden = false;
  }

  function hideQuickReplies() {
    quickWrap.hidden = true;
    quickWrap.innerHTML = "";
  }

  quickWrap.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (chip) sendMessage(chip.textContent);
  });

  /* ---------------- Open / close chat ---------------- */
  function openChat(contact) {
    session++;
    current = contact;
    contact.unread = 0;
    renderList(searchEl.value);

    chatAvatar.textContent = contact.initials;
    chatAvatar.style.setProperty("--av", contact.color);
    chatName.textContent = contact.name;
    chatStatus.textContent = `${contact.flag} ${contact.country} · ` +
      (contact.online ? "Online now" : "Last seen recently");
    chatLevel.textContent = contact.level;

    messages.innerHTML = '<div class="day-divider">Today</div>';
    hideQuickReplies();
    msgInput.value = "";

    app.classList.add("chat-open");
    requestAnimationFrame(() => { messages.scrollTop = 0; });

    playGreeting(contact);
  }

  /* Delivers the greeting lines one at a time, at a human pace:
     a short reading pause, then the typing indicator, then the bubble. */
  function playGreeting(c) {
    const lines = [
      { t: "Jambo! 👋",
        s: "Hello — a standard Swahili greeting." },
      { t: `Mimi ni ${c.first}. Nimefurahi kukutana nawe.`,
        s: `My name is ${c.first}. It is a pleasure to meet you.` },
      { t: `My goal is to ${c.goal}. I would value your guidance.`,
        s: "" }
    ];

    let i = 0;

    const deliverNext = () => {
      if (i >= lines.length) { showQuickReplies(); return; }

      const line = lines[i];
      showTyping();

      later(() => {
        hideTyping();
        addBubble(line.t, "in", line.s);
        i++;
        // brief pause between consecutive messages
        later(deliverNext, readPause(700, 1200));
      }, typingDelay(line.t));
    };

    // initial reading pause before the first typing indicator
    later(deliverNext, readPause(950, 1500));
  }

  function closeChat() {
    session++;
    hideTyping();
    app.classList.remove("chat-open");
    current = null;
    setTimeout(() => {
      if (!app.classList.contains("chat-open")) {
        messages.innerHTML = '<div class="day-divider">Today</div>';
      }
    }, 320);
  }

  /* ---------------- Sending ---------------- */
  function sendMessage(raw) {
    const text = (raw || "").trim();
    if (!text || !current) return;

    const contact = current;

    addBubble(text, "out");
    msgInput.value = "";
    hideQuickReplies();

    contact.last = "You: " + text;
    contact.time = "Now";
    renderList(searchEl.value);

    const reply = CANNED[replyIdx % CANNED.length];
    replyIdx++;

    // read pause → typing indicator → bubble
    later(() => {
      showTyping();
      later(() => {
        hideTyping();
        addBubble(reply.t, "in", reply.s);
        contact.last = reply.t;
        contact.time = "Now";
        renderList(searchEl.value);
      }, typingDelay(reply.t));
    }, readPause(1300, 2200));
  }

  /* ---------------- Events ---------------- */
  chatList.addEventListener("click", e => {
    const item = e.target.closest(".chat-item");
    if (!item) return;
    const contact = contacts.find(c => c.id === Number(item.dataset.id));
    if (contact) openChat(contact);
  });

  searchEl.addEventListener("input", () => renderList(searchEl.value));

  backBtn.addEventListener("click", closeChat);

  composer.addEventListener("submit", e => {
    e.preventDefault();
    sendMessage(msgInput.value);
  });

  /* ---------------- Boot ---------------- */
  renderList();
})();
</script>
</body>
</html>
